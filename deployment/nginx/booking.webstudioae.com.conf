# =============================================================================
# GLOBAL BOOKING — Nginx Virtual Host Configuration: Frontend Web Application
# Domain: booking.webstudioae.com
# Upstream: http://127.0.0.1:3000 (Next.js Application via PM2)
# =============================================================================

# 1. HTTP — Redirect all non-encrypted traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name booking.webstudioae.com;

    # Allow Let's Encrypt ACME challenge verification
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS — Main Reverse Proxy with Cloudflare SSL Termination
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name booking.webstudioae.com;

    # SSL Certificate Configuration (Adapt paths for Let's Encrypt or Cloudflare Origin CA)
    ssl_certificate /etc/letsencrypt/live/booking.webstudioae.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/booking.webstudioae.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Upload buffer limit
    client_max_body_size 10M;

    # Proxy to Next.js App
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket / Fast Navigation support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Forwarded Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Proxy timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
